[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-panns"
version = "0.1.0"
description = "A small Ray Serve application for asynchronous PANNs audio tagging"
requires-python = ">=3.10"
dependencies = [
  "ray[serve]==2.58.0",
  "jinja2>=3.1",
  "panns-inference>=0.1.1",
  "soundfile>=0.12",
  "librosa>=0.10",
  "numpy>=1.24",
  "celery>=5.3",
  "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["ray_panns*"]
